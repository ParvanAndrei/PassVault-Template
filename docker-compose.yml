version: "3.8"

services:

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${WG_CONFIG_DIR:-./config/wireguard}:/config
      - /lib/modules:/lib/modules
    ports:
      - ${WG_PORT:-51820}:${WG_PORT:-51820}/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
 
  vaultwarden:
    image: vaultwarden/server:${VW_IMAGE_TAG:-latest}
    container_name: ${VW_CONTAINER_NAME:-vaultwarden}
    environment:
      - WEBSOCKET_ENABLED=${VW_WEBSOCKET_ENABLED:-true}
      - DOMAIN=${VW_DOMAIN:-}
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
    volumes:
      - ${VW_DATA_DIR:-./data/vaultwarden}:/data
    networks:
      - internal
networks:
 internal:
   driver: bridge
